<style>
.viz-root {
  color-scheme: light;
  --surface-1:      #fcfcfb;

  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --series-1:       #2a78d6;
  --border:         rgba(11,11,11,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --series-1:       #3987e5;
    --border:         rgba(255,255,255,0.10);
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --page-plane:     #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --muted:          #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --series-1:       #3987e5;
  --border:         rgba(255,255,255,0.10);
}

* { box-sizing: border-box; }
body { margin: 0; }
.viz-root {
  background: var(--page-plane);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 32px 24px 64px;
  max-width: 1280px;
  margin: 0 auto;
}
h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
.subtitle { color: var(--text-secondary); font-size: 14px; max-width: 780px; line-height: 1.5; margin: 0 0 4px; }
.note { color: var(--muted); font-size: 12.5px; max-width: 780px; line-height: 1.5; margin: 0 0 16px; }
.note code { background: var(--surface-1); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

.controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.view-toggle button {
  background: var(--surface-1); color: var(--text-secondary); border: none; padding: 8px 14px;
  font-size: 12.5px; cursor: pointer; font-family: inherit;
}
.view-toggle button.active { background: var(--series-1); color: #fff; font-weight: 600; }
.view-toggle button:not(.active):hover { color: var(--text-primary); }

.legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { display: inline-block; width: 14px; height: 14px; flex: none; }

.toggle-btn {
  background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; margin-bottom: 20px;
}
.toggle-btn:hover { border-color: var(--text-secondary); }

.collection-section {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  padding: 18px 20px 14px; margin-bottom: 18px;
}
.collection-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
.collection-title { font-size: 15px; font-weight: 700; }
.collection-meta { font-size: 12px; color: var(--muted); }

.panel-row { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 10px; }
@media (max-width: 820px) { .panel-row { grid-template-columns: repeat(2, minmax(150px, 1fr)); } }

.panel { text-align: center; }
.panel-title { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 2px; }
.panel-stats { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

.axis-label { fill: var(--muted); font-size: 8.5px; }
.tick-label { fill: var(--muted); font-size: 7.5px; }
.gridline { stroke: var(--gridline); stroke-width: 1; }
.baseline { stroke: var(--baseline); stroke-width: 1; }
.diagonal { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
.pt { cursor: pointer; }
.pt:hover { stroke-width: 1.4; }

#tooltip {
  position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
  font-size: 11.5px; line-height: 1.5; padding: 7px 10px; border-radius: 6px; opacity: 0;
  transform: translate(-50%, -115%); white-space: nowrap; z-index: 10; transition: opacity 0.08s ease;
}

#table-wrap { display: none; overflow-x: auto; margin-bottom: 24px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
td { font-variant-numeric: tabular-nums; }
</style>

const TRAIT_LABELS = {"type_1_diabetes_mellitus": "Type 1 diabetes", "type_2_diabetes_mellitus": "Type 2 diabetes", "red_blood_cell_traits": "Red blood cell traits", "heart_rate": "Heart rate"};
const TRAITS = ["type_1_diabetes_mellitus", "type_2_diabetes_mellitus", "red_blood_cell_traits", "heart_rate"];
const ALPHA = 0.05;
const MINP = 1e-300;

const W = 210, H = 190, PAD_L = 32, PAD_B = 18, PAD_T = 6, PAD_R = 8;
const plotW = W - PAD_L - PAD_R;
const plotH = H - PAD_T - PAD_B;

const VIEWS = {
  z: {
    xLabel: 'CHEERS Z', yLabel: 'CREST-GV Z',
    getX: p => p.cheersZ, getY: p => p.crestZ,
    subtitle: "Each point is one cell type. X: CHEERS enrichment Z-score (observed specificity rank vs. theoretical null, SD units). Y: CREST-GV's CREST-GV_norm Z-statistic. Axes are scaled independently per panel (CHEERS Z can range into the tens/hundreds; CREST-GV's norm Z is standardized to ~[-3, 3] by construction) - compare rank/pattern, not absolute position.",
  },
  p: {
    xLabel: '-log10(CHEERS p)', yLabel: '-log10(CREST-GV p, norm)',
    getX: p => -Math.log10(Math.max(p.cheersP, MINP)), getY: p => -Math.log10(Math.max(p.crestPNorm, MINP)),
    subtitle: "Each point is one cell type. X: CHEERS's own reported p-value, Y: CREST-GV's normalized p-value, both as -log10 (higher = more significant). Points piling up at the right/top edge of a panel reflect p-values that floating-point underflow to exactly 0 in strongly-enriched collections.",
  },
};
let currentView = 'z';

function fmtNum(x) {
  if (x === null || x === undefined || !isFinite(x)) return '&ndash;';
  return Math.abs(x) >= 1000 ? x.toExponential(2) : x.toFixed(2);
}
function fmtP(x) {
  if (x === null || x === undefined) return '&ndash;';
  return x < 0.0001 ? x.toExponential(2) : x.toFixed(4);
}

function markerSvg(cheersSig, crestSig, cx, cy, r, extraAttrs) {
  cx = Number(cx); cy = Number(cy);
  const fill = cheersSig ? 'var(--series-1)' : 'none';
  const sw = cheersSig ? 1 : 1.4;
  if (crestSig) {
    return `<circle class="pt" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${fill}" stroke="var(--series-1)" stroke-width="${sw}" ${extraAttrs}/>`;
  } else {
    const s = r * 1.9;
    const x1 = cx, y1 = cy - s*0.6, x2 = cx + s*0.55, y2 = cy + s*0.4, x3 = cx - s*0.55, y3 = cy + s*0.4;
    const pts = [[x1,y1],[x2,y2],[x3,y3]].map(([px,py]) => `${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    return `<polygon class="pt" points="${pts}" fill="${fill}" stroke="var(--series-1)" stroke-width="${sw}" ${extraAttrs}/>`;
  }
}

function tickFmt(v) {
  return Math.abs(v) < 10 ? v.toFixed(1) : v.toFixed(0);
}

function renderPanel(svgEl, points, view) {
  if (!points.length) { svgEl.innerHTML = ''; return; }
  const vw = VIEWS[view];
  const xs = points.map(vw.getX).filter(isFinite);
  const ys = points.map(vw.getY).filter(isFinite);

  // independent per-axis domains - CHEERS Z and CREST-GV's norm Z have very
  // different natural ranges (the latter is standardized to ~mean 0, sd 1
  // within its own collection), so a shared/square domain would squash
  // whichever axis has the narrower range into a sliver. Each subplot scales
  // its own X and Y independently.
  const xLoRaw = Math.min(...xs), xHiRaw = Math.max(...xs);
  const yLoRaw = Math.min(...ys), yHiRaw = Math.max(...ys);
  const xPad = (xHiRaw - xLoRaw) * 0.08 || 1;
  const yPad = (yHiRaw - yLoRaw) * 0.08 || 1;
  const xLo = view === 'p' ? Math.min(0, xLoRaw - xPad) : xLoRaw - xPad;
  const xHi = xHiRaw + xPad;
  const yLo = view === 'p' ? Math.min(0, yLoRaw - yPad) : yLoRaw - yPad;
  const yHi = yHiRaw + yPad;

  const sx = v => PAD_L + (v - xLo) / (xHi - xLo) * plotW;
  const sy = v => PAD_T + plotH - (v - yLo) / (yHi - yLo) * plotH;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">`;

  if (xLo < 0 && xHi > 0) {
    s += `<line class="gridline" x1="${sx(0)}" y1="${PAD_T}" x2="${sx(0)}" y2="${PAD_T+plotH}"/>`;
  }
  if (yLo < 0 && yHi > 0) {
    s += `<line class="gridline" x1="${PAD_L}" y1="${sy(0)}" x2="${PAD_L+plotW}" y2="${sy(0)}"/>`;
  }
  s += `<line class="baseline" x1="${PAD_L}" y1="${PAD_T+plotH}" x2="${PAD_L+plotW}" y2="${PAD_T+plotH}"/>`;
  s += `<line class="baseline" x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${PAD_T+plotH}"/>`;
  s += `<text class="tick-label" x="${PAD_L}" y="${H-4}" text-anchor="start">${tickFmt(xLo)}</text>`;
  s += `<text class="tick-label" x="${PAD_L+plotW}" y="${H-4}" text-anchor="end">${tickFmt(xHi)}</text>`;
  s += `<text class="tick-label" x="${PAD_L-3}" y="${PAD_T+plotH}" text-anchor="end">${tickFmt(yLo)}</text>`;
  s += `<text class="tick-label" x="${PAD_L-3}" y="${PAD_T+7}" text-anchor="end">${tickFmt(yHi)}</text>`;
  s += `<text class="axis-label" x="${PAD_L+plotW/2}" y="${H-1}" text-anchor="middle">${vw.xLabel}</text>`;
  s += `<text class="axis-label" x="9" y="${PAD_T+plotH/2}" text-anchor="middle" transform="rotate(-90 9 ${PAD_T+plotH/2})">${vw.yLabel}</text>`;

  points.forEach(p => {
    const x = vw.getX(p), y = vw.getY(p);
    if (!isFinite(x) || !isFinite(y)) return;
    const cheersSig = p.cheersP !== null && p.cheersP < ALPHA;
    const crestSig = p.crestPNorm !== null && p.crestPNorm < ALPHA;
    const extra = `data-celltype="${p.cellType.replace(/"/g,'&quot;')}" data-cheersz="${p.cheersZ}" data-crestz="${p.crestZ}" data-cheersp="${p.cheersP}" data-crestp="${p.crestPNorm}"`;
    s += markerSvg(cheersSig, crestSig, sx(x), sy(y), 3.2, extra);
  });

  s += `</svg>`;
  svgEl.innerHTML = s;
}

const sectionsEl = document.getElementById('sections');
const tooltip = document.getElementById('tooltip');
const tbody = document.getElementById('table-body');
let tableRows = [];

function buildSections() {
  sectionsEl.innerHTML = '';
  for (const [ckey, cdata] of Object.entries(DATA)) {
    const section = document.createElement('div');
    section.className = 'collection-section';
    const nMax = Math.max(...TRAITS.map(t => (cdata.traits[t].points || []).length));
    section.innerHTML = `
      <div class="collection-header">
        <div class="collection-title">${cdata.label}</div>
        <div class="collection-meta">${nMax} cell types</div>
      </div>
      <div class="panel-row"></div>
    `;
    const row = section.querySelector('.panel-row');
    TRAITS.forEach(trait => {
      const td = cdata.traits[trait];
      const panel = document.createElement('div');
      panel.className = 'panel';
      const rhoStr = td.rho === null ? 'n/a' : td.rho.toFixed(2);
      panel.innerHTML = `
        <div class="panel-title">${TRAIT_LABELS[trait]}</div>
        <div class="panel-svg" data-collection="${ckey}" data-trait="${trait}"></div>
        <div class="panel-stats">&rho;=${rhoStr} &middot; n=${td.n}</div>
      `;
      renderPanel(panel.querySelector('.panel-svg'), td.points, currentView);
      row.appendChild(panel);
    });
    sectionsEl.appendChild(section);
  }
}

function rerenderAll() {
  document.querySelectorAll('.panel-svg').forEach(el => {
    const ckey = el.dataset.collection, trait = el.dataset.trait;
    renderPanel(el, DATA[ckey].traits[trait].points, currentView);
  });
}

function updateChrome() {
  document.getElementById('subtitle').textContent = VIEWS[currentView].subtitle;
  document.getElementById('footnote').innerHTML =
    `Marker fill: solid = CHEERS p&lt;${ALPHA}, hollow = not significant in CHEERS. Marker shape: circle = CREST-GV p&lt;${ALPHA} (normalized), triangle = not significant in CREST-GV. ` +
    `&rho; = Spearman rank correlation between the two methods' p-values (same value in both views - it's invariant to this monotonic transform). Collections ordered by cell-type count, smallest first.`;
  document.getElementById('btn-z').classList.toggle('active', currentView === 'z');
  document.getElementById('btn-p').classList.toggle('active', currentView === 'p');
}

document.getElementById('btn-z').addEventListener('click', () => { currentView = 'z'; updateChrome(); rerenderAll(); });
document.getElementById('btn-p').addEventListener('click', () => { currentView = 'p'; updateChrome(); rerenderAll(); });

buildSections();
updateChrome();

document.addEventListener('mousemove', (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains('pt')) {
    const cheersSig = (+t.dataset.cheersp) < ALPHA;
    const crestSig = (+t.dataset.crestp) < ALPHA;
    tooltip.innerHTML = `<strong>${t.dataset.celltype}</strong><br>CHEERS Z: ${fmtNum(+t.dataset.cheersz)} (p=${fmtP(+t.dataset.cheersp)}, ${cheersSig?'sig':'n.s.'})<br>CREST-GV Z: ${fmtNum(+t.dataset.crestz)} (p=${fmtP(+t.dataset.crestp)}, ${crestSig?'sig':'n.s.'})`;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.style.opacity = '1';
  } else {
    tooltip.style.opacity = '0';
  }
});

for (const [ckey, cdata] of Object.entries(DATA)) {
  TRAITS.forEach(trait => {
    cdata.traits[trait].points.forEach(p => {
      const cheersSig = p.cheersP !== null && p.cheersP < ALPHA;
      const crestSig = p.crestPNorm !== null && p.crestPNorm < ALPHA;
      tableRows.push([cdata.label, TRAIT_LABELS[trait], p.cellType, p.cheersZ, p.crestZ, p.cheersP, p.crestPNorm, cheersSig, crestSig]);
    });
  });
}
tableRows.forEach(r => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${fmtNum(r[3])}</td><td>${fmtNum(r[4])}</td><td>${fmtP(r[5])}</td><td>${fmtP(r[6])}</td><td>${r[7]?'yes':'no'}</td><td>${r[8]?'yes':'no'}</td>`;
  tbody.appendChild(tr);
});

document.getElementById('table-toggle').addEventListener('click', (e) => {
  const wrap = document.getElementById('table-wrap');
  const showing = wrap.style.display === 'block';
  wrap.style.display = showing ? 'none' : 'block';
  e.target.textContent = showing ? 'Show data table' : 'Hide data table';
});
</script>
